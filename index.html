<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoftStack Stockroom</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
       SoftStack Stockroom Theme Manager
       ========================================================================== */

        /* DEFAULT: Nordic Mist */
        :root {
            --bg-main: #e0e7e9;
            --bg-card: #ffffff;
            --text-main: #354649;
            --text-muted: #6c7a89;
            --accent: #a3c6c4;
            --accent-hover: #8bb3b1;
            --border: #cad5d8;
            --table-header-bg: #cfdadc;
            --badge-bg: #e0e7e9;
        }

        /* LIGHT MODE: Pastel Cafe & Cream */
        [data-theme="light-cafe"] {
            --bg-main: #fff8e7;
            --bg-card: #ffffff;
            --text-main: #4e3440;
            --text-muted: #725161;
            --accent: #ffcbcb;
            --accent-hover: #f1b5b5;
            --border: #f3e2c8;
            --table-header-bg: #bb7171;
            --table-header-text: #ffffff;
            --badge-bg: #c1f6e7;
        }

        /* LIGHT MODE OPTION B: Sage & Lavender */
        [data-theme="light-sage"] {
            --bg-main: #dff0ea;
            --bg-card: #ffffff;
            --text-main: #4f3a65;
            --text-muted: #574f7d;
            --accent: #95adbe;
            --accent-hover: #7d97aa;
            --border: #c8e0d8;
            --table-header-bg: #574f7d;
            --table-header-text: #ffffff;
            --badge-bg: #e2d9f3;
        }

        /* DARK MODE: Charcoal & Mustard */
        [data-theme="dark"] {
            --bg-main: #1c1c1e;
            --bg-card: #2c2c2e;
            --text-main: #eceff1;
            --text-muted: #98989d;
            --accent: #f7b633;
            --accent-hover: #dba024;
            --border: #455a64;
            --table-header-bg: #607d8b;
            --table-header-text: #ffffff;
            --badge-bg: #455a64;
        }

        /* Base Styling */
        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 2rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
        }

        /* Header Controls */
        .header-layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        select, button {
            font-family: inherit;
            font-size: 0.9rem;
        }

        select {
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg-card);
            color: var(--text-main);
            outline: none;
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--text-main);
            border: none;
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 8px;
            padding: 0.5rem 0.9rem;
            cursor: pointer;
            margin-left: 0.5rem;
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Monospace and right-aligned styling for numeric IDs */
        td.id-cell, th.id-col {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 600;
            text-align: right;
            width: 70px;
            padding-right: 1.5rem;
        }

        /* Table Styling */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: var(--table-header-bg, var(--accent));
            color: var(--table-header-text, var(--text-main));
            padding: 0.85rem 1rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(0, 0, 0, 0.02);
        }

        /* Visual Badges & Pricing */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background-color: var(--badge-bg);
            color: var(--text-main);
        }

        .price-original {
            text-decoration: line-through;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-right: 0.4rem;
        }

        .price-final {
            font-weight: 700;
        }

        /* Modal & Form Overlay Styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            z-index: 1000;
        }

        .modal-card {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .form-input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg-card);
            color: var(--text-main);
            outline: none;
            font-family: inherit;
        }
    </style>
</head>
<body>

<div class="container">
    <header class="card header-layout">
        <div>
            <h1 style="margin: 0; font-size: 1.5rem; font-weight: 700;">
                SoftStack Stockroom <span aria-hidden="true">☕</span>
            </h1>
            <p style="margin: 0.2rem 0 0 0; color: var(--text-muted); font-size: 0.9rem;">
                Inventory Management Dashboard
            </p>
        </div>

        <div style="display: flex; align-items: center;">
            <label for="theme-select" style="font-weight: 600; margin-right: 0.5rem; font-size: 0.9rem;">Theme:</label>
            <select id="theme-select" onchange="changeTheme(this.value)">
                <option value="default">Nordic Mist (Default)</option>
                <option value="light-cafe">Pastel Cafe & Cream</option>
                <option value="light-sage">Sage & Lavender</option>
                <option value="dark">Charcoal & Mustard (Dark)</option>
            </select>
            <button class="btn-secondary" onclick="logout()">Log Out</button>
        </div>
    </header>

    <main class="card">
        <div class="header-layout" style="margin-bottom: 1rem; gap: 0.5rem; flex-wrap: wrap;">
            <div style="display: flex; gap: 0.5rem; flex: 1; min-width: 280px;">
                <input type="text" id="search-input" placeholder="Search by target price..." class="form-input"
                       style="flex: 1;" onkeyup="handleSearch(event)">
                <button class="btn-secondary" onclick="executeSearch()">🔍 Search</button>
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <button class="btn-primary" onclick="openProductModal()">➕ Add Product</button>
                <button class="btn-secondary" onclick="resetSearch()">🔄 Refresh</button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th scope="col" class="id-col">ID</th>
                        <th scope="col">Item Name</th>
                        <th scope="col">Category</th>
                        <th scope="col">Price</th>
                        <th scope="col">Discount</th>
                        <th scope="col">Final Price</th>
                        <th scope="col" style="text-align: center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="product-table-body" aria-live="polite">
                </tbody>
            </table>
        </div>

        <div id="empty-state" style="display: none; text-align: center; padding: 3rem 1rem;">
            <p style="font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem;">No items found in stock ☕</p>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Your inventory is currently empty.</p>
        </div>

        <div class="header-layout" style="margin-top: 1rem; padding-top: 0.5rem;">
            <span id="page-info" style="font-size: 0.85rem; color: var(--text-muted);">Page 1</span>
            <div>
                <button id="prev-btn" class="btn-secondary" onclick="changePage(-1)" disabled>Previous</button>
                <button id="next-btn" class="btn-secondary" onclick="changePage(1)">Next</button>
            </div>
        </div>
    </main>
</div>

<div id="login-modal" class="modal-overlay">
    <div class="card modal-card">
        <h2>SoftStack Stockroom ☕</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Please log in to manage inventory.</p>

        <form onsubmit="handleLogin(event)">
            <div style="margin-bottom: 1rem; text-align: left;">
                <label for="username" style="display: block; font-weight: 600; margin-bottom: 0.3rem;">Username</label>
                <input type="text" id="username" required placeholder="nicole" class="form-input">
            </div>

            <div style="margin-bottom: 1.5rem; text-align: left;">
                <label for="password" style="display: block; font-weight: 600; margin-bottom: 0.3rem;">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="form-input">
            </div>

            <p id="login-error" style="color: #e77c7c; display: none; margin-bottom: 1rem; font-size: 0.9rem;"></p>

            <button type="submit" class="btn-primary" style="width: 100%; padding: 0.8rem;">Log In</button>
        </form>
    </div>
</div>


<div id="product-modal" class="modal-overlay" style="display: none;">
    <div class="card modal-card" style="max-width: 450px;">
        <h2 id="modal-title">Add New Product ☕</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.2rem; font-size: 0.9rem;">
            Enter product details below.
        </p>

        <form onsubmit="handleSaveProduct(event)">
            <input type="hidden" id="product-id">

            <div style="margin-bottom: 0.8rem; text-align: left;">
                <label for="product-name"
                       style="display: block; font-weight: 600; margin-bottom: 0.3rem; font-size: 0.85rem;">Product
                    Name</label>
                <input type="text" id="product-name" required placeholder="e.g. Vanilla Bean Latte" class="form-input">
            </div>

            <div style="margin-bottom: 0.8rem; text-align: left;">
                <label for="product-type"
                       style="display: block; font-weight: 600; margin-bottom: 0.3rem; font-size: 0.85rem;">Category /
                    Type</label>
                <input type="text" id="product-type" required placeholder="e.g. Beverage, Merch, Pastry"
                       class="form-input">
            </div>

            <div style="display: flex; gap: 0.8rem; margin-bottom: 1.2rem;">
                <div style="flex: 1; text-align: left;">
                    <label for="product-price"
                           style="display: block; font-weight: 600; margin-bottom: 0.3rem; font-size: 0.85rem;">Price
                        ($)</label>
                    <input type="number" id="product-price" step="0.01" min="0" required placeholder="4.50"
                           class="form-input">
                </div>
                <div style="flex: 1; text-align: left;">
                    <label for="product-discount"
                           style="display: block; font-weight: 600; margin-bottom: 0.3rem; font-size: 0.85rem;">Discount
                        (%)</label>
                    <input type="number" id="product-discount" step="1" min="0" max="100" value="0" class="form-input">
                </div>
            </div>

            <p id="product-modal-error"
               style="color: #e77c7c; display: none; margin-bottom: 1rem; font-size: 0.85rem;"></p>

            <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                <button type="button" class="btn-secondary" onclick="closeProductModal()">Cancel</button>
                <button type="submit" class="btn-primary">Save Product</button>
            </div>
        </form>
    </div>
</div>


<script>
    const API_URL = "http://127.0.0.1:8000";

    function changeTheme(themeName) {
        if (themeName === 'default') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', themeName);
        localStorage.setItem('preferredTheme', themeName);
    }

    // Check saved settings and token state on load
    window.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('preferredTheme');
        if (savedTheme) {
            document.getElementById('theme-select').value = savedTheme;
            changeTheme(savedTheme);
        }

        const token = localStorage.getItem('access_token');
        if (token) {
            document.getElementById('login-modal').style.display = 'none';
            loadProducts();
        } else {
            document.getElementById('login-modal').style.display = 'flex';
        }
    });

    // Handle Form Authentication
    async function handleLogin(event) {
        event.preventDefault();
        const errorMsg = document.getElementById('login-error');
        errorMsg.style.display = 'none';

        const usernameInput = document.getElementById('username').value;
        const passwordInput = document.getElementById('password').value;

        const formData = new URLSearchParams();
        formData.append('username', usernameInput);
        formData.append('password', passwordInput);

        try {
            const response = await fetch(`${API_URL}/auth/token`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: formData,
            });

            if (!response.ok) {
                throw new Error('Incorrect username or password.');
            }

            const data = await response.json();
            localStorage.setItem('access_token', data.access_token);

            // Hide login modal and load stock items
            document.getElementById('login-modal').style.display = 'none';
            loadProducts();

        } catch (err) {
            errorMsg.textContent = err.message;
            errorMsg.style.display = 'block';
        }
    }

    // Log Out Action
    function logout() {
        localStorage.removeItem('access_token');
        document.getElementById('login-modal').style.display = 'flex';
        document.getElementById('product-table-body').innerHTML = '';
    }

    let currentOffset = 0;
    const PAGE_LIMIT = 10;

    async function loadProducts() {
        const token = localStorage.getItem('access_token');
        if (!token) return;

        const tbody = document.getElementById('product-table-body');
        const emptyState = document.getElementById('empty-state');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageInfo = document.getElementById('page-info');

        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Loading stockroom data...</td></tr>';
        emptyState.style.display = 'none';

        try {
            const response = await fetch(`${API_URL}/products?limit=${PAGE_LIMIT}&offset=${currentOffset}`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.status === 401) {
                logout();
                throw new Error('Session expired. Please log in again.');
            }

            if (!response.ok) throw new Error('Failed to load inventory.');

            const products = await response.json();

            // Render rows using our helper function
            renderTableRows(products);

            // Pagination controls state
            prevBtn.disabled = currentOffset === 0;
            nextBtn.disabled = products.length < PAGE_LIMIT;
            pageInfo.textContent = `Showing ${currentOffset + 1} - ${currentOffset + products.length}`;

        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #e77c7c;">Error: ${err.message}</td></tr>`;
        }
    }

    function renderTableRows(products) {
        const tbody = document.getElementById('product-table-body');
        const emptyState = document.getElementById('empty-state');
        tbody.innerHTML = '';

        if (!products || products.length === 0) {
            if (currentOffset === 0) {
                emptyState.style.display = 'block';
            }
            return;
        }

        emptyState.style.display = 'none';

        products.forEach(item => {
            const row = document.createElement('tr');

            // 1. ID Cell
            const idCell = document.createElement('td');
            idCell.className = 'id-cell';
            idCell.textContent = `#${item.ID}`;

            // 2. Name Cell
            const nameCell = document.createElement('td');
            const strongName = document.createElement('strong');
            strongName.textContent = item.Name;
            nameCell.appendChild(strongName);

            // 3. Category / Type Cell
            const typeCell = document.createElement('td');
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = item.Type;
            typeCell.appendChild(badge);

            // 4. Price Cell
            const priceCell = document.createElement('td');
            if (item.DiscountPercent > 0) {
                const origPrice = document.createElement('span');
                origPrice.className = 'price-original';
                origPrice.textContent = `$${item.Price.toFixed(2)}`;
                priceCell.appendChild(origPrice);
            } else {
                priceCell.appendChild(document.createTextNode(`$${item.Price.toFixed(2)}`));
            }

            // 5. Discount Cell
            const discountCell = document.createElement('td');
            discountCell.textContent = `${item.DiscountPercent}%`;

            // 6. Final Price Cell
            const finalPriceCell = document.createElement('td');
            finalPriceCell.className = 'price-final';
            const finalPrice = item.FinalPrice || item.Price;
            finalPriceCell.textContent = `$${finalPrice.toFixed(2)}`;

            // 7. Actions Cell (EDIT & DELETE BUTTONS) 🛠️
            const actionCell = document.createElement('td');
            actionCell.style.textAlign = 'center';

            const editBtn = document.createElement('button');
            editBtn.className = 'btn-secondary';
            editBtn.style.padding = '0.25rem 0.5rem';
            editBtn.style.fontSize = '0.8rem';
            editBtn.textContent = '✏️ Edit';
            editBtn.onclick = () => openProductModal(item);

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn-secondary';
            deleteBtn.style.padding = '0.25rem 0.5rem';
            deleteBtn.style.fontSize = '0.8rem';
            deleteBtn.style.color = '#e77c7c';
            deleteBtn.style.borderColor = '#e77c7c';
            deleteBtn.style.marginLeft = '0.3rem';
            deleteBtn.textContent = '🗑️ Delete';
            deleteBtn.onclick = () => deleteProduct(item.ID, item.Name);

            actionCell.appendChild(editBtn);
            actionCell.appendChild(deleteBtn);

            // Append all cells to row
            row.appendChild(idCell);
            row.appendChild(nameCell);
            row.appendChild(typeCell);
            row.appendChild(priceCell);
            row.appendChild(discountCell);
            row.appendChild(finalPriceCell);
            row.appendChild(actionCell);

            tbody.appendChild(row);
        });
    }


    function changePage(direction) {
        currentOffset += direction * PAGE_LIMIT;
        if (currentOffset < 0) currentOffset = 0;
        loadProducts();
    }

    // ==========================================
    // MODAL & CRUD ACTIONS
    // ==========================================

    function openProductModal(item = null) {
        const modal = document.getElementById('product-modal');
        const title = document.getElementById('modal-title');
        const errorMsg = document.getElementById('product-modal-error');
        errorMsg.style.display = 'none';

        if (item) {
            // Edit Mode
            title.textContent = 'Edit Product ✏️';
            document.getElementById('product-id').value = item.ID;
            document.getElementById('product-name').value = item.Name;
            document.getElementById('product-type').value = item.Type;
            document.getElementById('product-price').value = item.Price;
            document.getElementById('product-discount').value = item.DiscountPercent || 0;
        } else {
            // Create Mode
            title.textContent = 'Add New Product ☕';
            document.getElementById('product-id').value = '';
            document.getElementById('product-name').value = '';
            document.getElementById('product-type').value = '';
            document.getElementById('product-price').value = '';
            document.getElementById('product-discount').value = 0;
        }

        modal.style.display = 'flex';
    }

    function closeProductModal() {
        document.getElementById('product-modal').style.display = 'none';
    }

    async function handleSaveProduct(event) {
        event.preventDefault();
        const token = localStorage.getItem('access_token');
        if (!token) return;

        const idVal = document.getElementById('product-id').value;
        const payload = {
            ID: idVal ? parseInt(idVal) : null,
            Name: document.getElementById('product-name').value.trim(),
            Type: document.getElementById('product-type').value.trim(),
            Price: parseFloat(document.getElementById('product-price').value),
            DiscountPercent: parseInt(document.getElementById('product-discount').value) || 0
        };

        try {
            const response = await fetch(`${API_URL}/products/mod`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.detail || 'Failed to save product.');
            }

            closeProductModal();
            loadProducts(); // Refresh list

        } catch (err) {
            const errorMsg = document.getElementById('product-modal-error');
            errorMsg.textContent = err.message;
            errorMsg.style.display = 'block';
        }
    }

    async function deleteProduct(productId, productName) {
        if (!confirm(`Are you sure you want to delete "${productName}"?`)) return;

        const token = localStorage.getItem('access_token');
        if (!token) return;

        try {
            const response = await fetch(`${API_URL}/products/bulk-delete`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({product_ids: [productId]})
            });

            if (!response.ok) throw new Error('Failed to delete product.');

            loadProducts(); // Refresh list

        } catch (err) {
            alert(`Error: ${err.message}`);
        }
    }

    // ==========================================
    // SEARCH & FILTER ACTIONS
    // ==========================================

    function handleSearch(event) {
        if (event.key === 'Enter') executeSearch();
    }

    async function executeSearch() {
        const priceVal = parseFloat(document.getElementById('search-input').value);
        if (isNaN(priceVal)) {
            loadProducts();
            return;
        }

        const token = localStorage.getItem('access_token');
        if (!token) return;

        const tbody = document.getElementById('product-table-body');
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Searching...</td></tr>';

        try {
            const response = await fetch(`${API_URL}/products/search?product_price=${priceVal}`, {
                headers: {'Authorization': `Bearer ${token}`}
            });

            if (!response.ok) throw new Error('Search failed.');

            const products = await response.json();
            renderTableRows(products);

        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #e77c7c;">${err.message}</td></tr>`;
        }
    }

    function resetSearch() {
        document.getElementById('search-input').value = '';
        currentOffset = 0;
        loadProducts();
    }

</script>
</body>
</html>
